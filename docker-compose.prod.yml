# Production Docker Compose for Little Wins
# Use this for production deployments with better security and performance

services:
  api:
    build: ./api
    image: ${API_IMAGE:-little-wins-api:local}
    container_name: little-wins-api-prod
    restart: unless-stopped
    environment:
      - RAILWAY_ENVIRONMENT=production
      - SECRET_KEY=${SECRET_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - CORS_ORIGINS=${CORS_ORIGINS}
      - ENABLE_GOOGLE_OAUTH=${ENABLE_GOOGLE_OAUTH:-0}
      - ENABLE_LEGACY_FEATURES=0
      - LOCAL_ACCESS_PASSWORD=${LOCAL_ACCESS_PASSWORD:-}
      - ALLOW_PASSWORDLESS_LOCAL_LOGIN=0
      - TRUST_PROXY_HOPS=1
      - DEFAULT_SELF_HOST_ID=${DEFAULT_SELF_HOST_ID:-selfhost_default_user}
      - DATABASE_PATH=/app/data/nightlio.db
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_CALLBACK_URL=${GOOGLE_CALLBACK_URL:-}
      - PORT=5000
    volumes:
      - nightlio_data:/app/data
    networks:
      - little-wins-network
    # Only expose to internal network in production
    expose:
      - "5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:5000/api/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  frontend:
    build: .
    image: ${WEB_IMAGE:-little-wins-web:local}
    container_name: little-wins-web-prod
    restart: unless-stopped
    # Only expose to internal network in production
    expose:
      - "80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - little-wins-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M

  # Reverse proxy for production
  nginx:
    image: nginx:alpine
    container_name: little-wins-nginx-prod
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx-prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl:ro  # Mount SSL certificates here
    depends_on:
      - frontend
      - api
    networks:
      - little-wins-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3

networks:
  little-wins-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  # Kept for backward compatibility with existing Nightlio-based installations.
  nightlio_data:
    driver: local
